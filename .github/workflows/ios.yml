name: iOS build

# Compiles the iOS app and widget on Apple's toolchain (simulator, unsigned), so native code is
# verified on every change without needing a Mac or signing certificates.
on:
  push:
    branches: [main]
    paths: ['ios/**', 'app/**', 'lib/**', 'capacitor.config.ts', 'scripts/build-native.mjs', 'package*.json', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'app/**', 'lib/**', 'capacitor.config.ts', 'scripts/build-native.mjs', 'package*.json', '.github/workflows/ios.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bundle the UI for the app
        run: npm run build:native
        env:
          API_BASE: https://example.up.railway.app
      - run: npx cap sync ios
      - name: Show toolchain
        run: xcodebuild -version
      - name: Build app + widget for the simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tee build.log | grep -E "error:|warning: .*Sidebet|BUILD (SUCCEEDED|FAILED)"
      - name: Check the widget is embedded
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path "*Debug-iphonesimulator/App.app" -type d | head -1)
          ls "$APP/PlugIns"
          test -d "$APP/PlugIns/SidebetWidget.appex"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build.log
